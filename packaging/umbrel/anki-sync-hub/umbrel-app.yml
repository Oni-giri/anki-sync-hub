manifestVersion: 1
id: anki-sync-hub
category: automation
name: Anki Sync Hub
version: "0.1.1"
tagline: Private Anki sync and AI deck automation
description: >-
  Run a private Anki sync service on your Umbrel, manage sync accounts from a
  browser, and connect AI tools through a scoped MCP endpoint.


  Sign in as admin with the generated password shown in Umbrel's app details,
  then create your first Anki sync account in the browser. No SSH,
  configuration-file editing, or container restart is required.


  This app is intended for your local network or a private Tailscale network.
  Do not expose its plain HTTP endpoint directly to the public internet.


  Anki is a registered trademark of Ankitects Pty Ltd. This project is not
  affiliated with or endorsed by Ankitects.
releaseNotes: >-
  Umbrel now provisions the admin account automatically with its generated app
  password and displays the credentials in the standard app details dialog.
  Existing owner accounts are preserved during restarts and upgrades.
