version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: anki-sync-hub_web_1
      APP_PORT: 8080
      # API routes use the app's owner session and same-origin write checks.
      # Sync and MCP clients use their own protocol credentials and bearer tokens.
      PROXY_AUTH_WHITELIST: "/api/*,/sync/*,/msync/*,/mcp,/mcp/*"

  web:
    image: ghcr.io/oni-giri/anki-sync-hub:0.1.7@sha256:d7915f01648de3f4c621e58fc0750b5067f8f3a64d9cb77e9a93da93565a9fd7
    user: "1000:1000"
    command: web
    restart: on-failure
    init: true
    stop_grace_period: 30s
    environment:
      ANKI_HUB_DATA_DIR: /data
      ANKI_HUB_SYNC_URL: http://sync:8081
      ANKI_HUB_MCP_URL: http://mcp:8082
      # Umbrel displays these credentials in the standard app details dialog.
      # The password is hashed into the database only when no owner exists.
      ANKI_HUB_ADMIN_USERNAME: admin
      ANKI_HUB_ADMIN_PASSWORD: "${APP_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    depends_on:
      - sync
      - mcp

  sync:
    image: ghcr.io/oni-giri/anki-sync-hub:0.1.7@sha256:d7915f01648de3f4c621e58fc0750b5067f8f3a64d9cb77e9a93da93565a9fd7
    user: "1000:1000"
    command: sync-supervisor
    restart: on-failure
    init: true
    stop_grace_period: 30s
    environment:
      ANKI_HUB_DATA_DIR: /data
      ANKI_HUB_SYNC_PORT: "8081"
    volumes:
      - ${APP_DATA_DIR}/data:/data

  mcp:
    image: ghcr.io/oni-giri/anki-sync-hub:0.1.7@sha256:d7915f01648de3f4c621e58fc0750b5067f8f3a64d9cb77e9a93da93565a9fd7
    user: "1000:1000"
    command: mcp
    restart: on-failure
    init: true
    stop_grace_period: 30s
    environment:
      ANKI_HUB_DATA_DIR: /data
      ANKI_HUB_SYNC_URL: http://sync:8081
      ANKI_HUB_MCP_PORT: "8082"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    depends_on:
      - sync
