version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: anki-sync-hub_web_1
      APP_PORT: 8080
      # Anki and MCP clients cannot provide an Umbrel browser session.
      # The sync protocol and MCP bearer tokens protect these narrow routes.
      PROXY_AUTH_WHITELIST: "/sync/*,/msync/*,/mcp,/mcp/*"

  web:
    image: ghcr.io/oni-giri/anki-sync-hub:0.1.1@sha256:070a6942c5fab0ef6240036fa23e29802202ae846672bdc24350cee28e5bde16
    user: "1000:1000"
    command: web
    restart: on-failure
    init: true
    stop_grace_period: 30s
    environment:
      ANKI_HUB_DATA_DIR: /data
      ANKI_HUB_SYNC_URL: http://sync:8081
      ANKI_HUB_MCP_URL: http://mcp:8082
      # Umbrel displays these credentials in the standard app details dialog.
      # The password is hashed into the database only when no owner exists.
      ANKI_HUB_ADMIN_USERNAME: admin
      ANKI_HUB_ADMIN_PASSWORD: "${APP_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    depends_on:
      - sync
      - mcp

  sync:
    image: ghcr.io/oni-giri/anki-sync-hub:0.1.1@sha256:070a6942c5fab0ef6240036fa23e29802202ae846672bdc24350cee28e5bde16
    user: "1000:1000"
    command: sync-supervisor
    restart: on-failure
    init: true
    stop_grace_period: 30s
    environment:
      ANKI_HUB_DATA_DIR: /data
      ANKI_HUB_SYNC_PORT: "8081"
    volumes:
      - ${APP_DATA_DIR}/data:/data

  mcp:
    image: ghcr.io/oni-giri/anki-sync-hub:0.1.1@sha256:070a6942c5fab0ef6240036fa23e29802202ae846672bdc24350cee28e5bde16
    user: "1000:1000"
    command: mcp
    restart: on-failure
    init: true
    stop_grace_period: 30s
    environment:
      ANKI_HUB_DATA_DIR: /data
      ANKI_HUB_SYNC_URL: http://sync:8081
      ANKI_HUB_MCP_PORT: "8082"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    depends_on:
      - sync
