version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: anki-sync-hub_web_1
      APP_PORT: 8080
      # Admin API routes use the owner's session and same-origin write checks.
      # Sync, REST API, and MCP clients use their own application credentials.
      PROXY_AUTH_WHITELIST: "/api/*,/sync/*,/msync/*,/mcp,/mcp/*"

  web:
    image: ghcr.io/oni-giri/anki-sync-hub:0.1.9@sha256:a50a7752c6444f7d3a0adee8a17ba1608d2fd4605361eb27e303279115458fa5
    user: "1000:1000"
    command: web
    restart: on-failure
    init: true
    stop_grace_period: 30s
    environment:
      ANKI_HUB_DATA_DIR: /data
      ANKI_HUB_SYNC_URL: http://sync:8081
      ANKI_HUB_MCP_URL: http://mcp:8082
      # Umbrel displays these credentials in the standard app details dialog.
      # The password is hashed into the database only when no owner exists.
      ANKI_HUB_ADMIN_USERNAME: admin
      ANKI_HUB_ADMIN_PASSWORD: "${APP_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    depends_on:
      - sync
      - mcp

  sync:
    image: ghcr.io/oni-giri/anki-sync-hub:0.1.9@sha256:a50a7752c6444f7d3a0adee8a17ba1608d2fd4605361eb27e303279115458fa5
    user: "1000:1000"
    command: sync-supervisor
    restart: on-failure
    init: true
    stop_grace_period: 30s
    environment:
      ANKI_HUB_DATA_DIR: /data
      ANKI_HUB_SYNC_PORT: "8081"
    volumes:
      - ${APP_DATA_DIR}/data:/data

  mcp:
    image: ghcr.io/oni-giri/anki-sync-hub:0.1.9@sha256:a50a7752c6444f7d3a0adee8a17ba1608d2fd4605361eb27e303279115458fa5
    user: "1000:1000"
    command: mcp
    restart: on-failure
    init: true
    stop_grace_period: 30s
    environment:
      ANKI_HUB_DATA_DIR: /data
      ANKI_HUB_SYNC_URL: http://sync:8081
      ANKI_HUB_MCP_PORT: "8082"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    depends_on:
      - sync
